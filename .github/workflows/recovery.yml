name: Recovery correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-recovery.lock.txt
      - run: python -m unittest -v mapf.test_recovery mapf.test_day3 mapf.test_repair mapf.test_ml_revision
